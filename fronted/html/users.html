<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>wicky-users</title>
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/global.css">

    <link rel="stylesheet" href="../css/users.css">
</head>
<body>

    <div class="heder">

        <div class="app-icon">
            <img src="../img/logo-wicky.png">
        </div>

        <h1 class="app-title app-title-display">WICKY</h1>

        <div class="account-status">
            <span class="status-dot"></span>
            <span class="account-email">correoelectrónico@ejemplo.com</span>
        </div>

        <p class="subtitle subtitle-users-big">selecciona tu usuario para continuar</p>

        <button class="btn users-btn-grid">

            <div class="user-avatar-administrador">MC</div>
            <div class="user-name">Mateo Castaño</div>
            <div class="user-role-administrador">administrador</div>

        </button>
        <button class="btn users-btn-grid">

            <div class="user-avatar-cajero">FC</div>
            <div class="user-name">Frank Castaño</div>
            <div class="user-role-cajero">cajero</div>

        </button>
        <button class="btn users-btn-grid">

            <div class="user-avatar-cajero">JG</div>
            <div class="user-name">Juan Garcia</div>
            <div class="user-role-cajero">cajero</div>

        </button>
        <button class="btn users-btn-grid">

            <div class="user-avatar-cajero">MR</div>
            <div class="user-name">Maicol Ramirez</div>
            <div class="user-role-cajero">cajero</div>

        </button>
    </div>
    
</body>
</html>
