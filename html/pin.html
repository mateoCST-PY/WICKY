<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>wicky-PIN</title>
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/global.css">

    <link rel="stylesheet" href="../css/pin.css">
</head>
<body>
    
    <div class="header">

        <div class="app-icon">
            <img src="../img/logo-wicky.png">
        </div>
        
        <h1 class="app-title">WICKY</h1>

        <div class="account-status">
            <span class="status-dot"></span>
            <span class="account-email">correoelectrónico@ejemplo.com</span>
        </div>


        <div class="card">

            <div class="user-avatar-administrador">MC</div>
            <div class="user-name">Mateo Castaño</div>
            <div class="user-rol-administrador">administrador</div>

            <p class="subtitle p-size">ingresa tu código PIN</p>

            <div class="pin-display">
                <span class="pin-dot"></span>
                <span class="pin-dot"></span>
                <span class="pin-dot"></span>
                <span class="pin-dot"></span>
            </div>

            <div class="pin-keypad">
                <button class="btn pin-key">1</button>
                <button class="btn pin-key">2</button>
                <button class="btn pin-key">3</button>
                <button class="btn pin-key">4</button>
                <button class="btn pin-key">5</button>
                <button class="btn pin-key">6</button>
                <button class="btn pin-key">7</button>
                <button class="btn pin-key">8</button>
                <button class="btn pin-key">9</button>
                <button class="pin-key nothing"></button>
                <button class="btn pin-key">0</button>
                <button class="btn pin-key">Borrar</button>
            </div>

        </div>



    </div>

</body>
</html>
