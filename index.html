<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>wicky-login</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/global.css">

    <link rel="stylesheet" href="css/login.css">
</head>
<body>

    <div class="card">

        <div class="header">
    
            <div class="app-icon">
                <img src="img/logo-wicky.png">
            </div>

            <h1 class="app-title">WICKY</h1>

            <p class="subtitle">sistema de ventas</p>
        
        </div>

        <form class="form">

            <label for="correo" class="section-starter-label">correo electronico</label>
            <input id="correo" type="email" class="section-starter-input" placeholder="ingresa tu correo electronico">
            <label for="password" class="section-starter-label">contraseña</label>
            <input id="password" type="password" class="section-starter-input" placeholder="ingresa tu contraseña">

        </form>

        <button class="btn btn-primary">ingresar</button>

        <a class="link-secondary">¿No tienes cuenta? Registrate aqui</a>

        <a class="link-secondary">¿Olvidaste tu contraseña? Click aqui</a>

    </div>
    
</body>
</html>
